name: Build plugin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Unzip
        run: |
          ls -la
          Z=$(find . -name "*.zip" -not -path "./.git/*" | head -n1)
          echo "Found: $Z"
          if [ -z "$Z" ]; then echo "ZIP NOT FOUND - upload plugin.zip"; exit 1; fi
          unzip -o "$Z" -d build-src
          P=$(dirname $(find build-src -name pom.xml | head -n1))
          echo "SRC=$P" >> $GITHUB_ENV
      - run: mvn -B clean package -DskipTests -Dpaper.api.version=1.21.11-R0.1-SNAPSHOT
        working-directory: ${{ env.SRC }}
      - run: |
          mkdir output
          cp ${{ env.SRC }}/target/*.jar output/
          rm -f output/original-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: TikTokHolograms-plugin
          path: output/
